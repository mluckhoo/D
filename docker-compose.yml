version: '3.8'

services:
  # Backend server (WebSocket + REST)
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    ports:
      - '8080:8080'
    env_file:
      - apps/server/.env
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8080/health']
      interval: 30s
      timeout: 10s
      retries: 3

